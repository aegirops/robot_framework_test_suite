[project]
name = "petstore-robot-tests"
version = "0.1.0"
description = "Robot Framework web service test suite for the Swagger Petstore API"
requires-python = ">=3.10,<4.0"
dependencies = ["robotframework (>=7.5,<8.0)", "robotframework-requests (>=0.9.7,<0.10.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "robotcode[analyze,repl,runner] (>=2.7.0,<3.0.0)"
]
